name: WordPress plugin lint

on:
  push:
    branches: [ main ]
    paths:
      - 'plugins/wp-security-challenge/**'
      - '.github/workflows/php-lint.yml'
  pull_request:
    paths:
      - 'plugins/wp-security-challenge/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: find plugins/wp-security-challenge -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax
        run: node --check plugins/wp-security-challenge/public/assets/js/gate.js
